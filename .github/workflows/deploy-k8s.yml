name: Deploy To Kubernetes

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'prod' }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://thejammers.org' }}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME || 'your_bot_username' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jammers
          SESSION_SECRET: ci-local-session-secret
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ env.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          ENABLE_DEV_AUTH: "true"
        run: npm run build

      - name: Compute image references
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="${IMAGE_NAME}:sha-${DEPLOY_SHA}"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jammers
            SESSION_SECRET=ci-local-session-secret
            ENABLE_DEV_AUTH=true
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ env.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        run: kubectl apply -k infra/k8s/overlays/production

      - name: Free capacity for migrations
        id: capacity
        run: |
          ORIGINAL_REPLICAS="$(kubectl -n "$K8S_NAMESPACE" get deployment jammers-web -o jsonpath='{.spec.replicas}')"
          ORIGINAL_HPA_MIN="$(kubectl -n "$K8S_NAMESPACE" get hpa jammers-web -o jsonpath='{.spec.minReplicas}')"
          ORIGINAL_HPA_MAX="$(kubectl -n "$K8S_NAMESPACE" get hpa jammers-web -o jsonpath='{.spec.maxReplicas}')"

          echo "replicas=${ORIGINAL_REPLICAS}" >> "$GITHUB_OUTPUT"
          echo "hpa_min=${ORIGINAL_HPA_MIN}" >> "$GITHUB_OUTPUT"
          echo "hpa_max=${ORIGINAL_HPA_MAX}" >> "$GITHUB_OUTPUT"

          kubectl -n "$K8S_NAMESPACE" patch hpa jammers-web --type=merge -p '{"spec":{"minReplicas":1,"maxReplicas":1}}'
          kubectl -n "$K8S_NAMESPACE" scale deployment/jammers-web --replicas=1
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/jammers-web --timeout=10m

      - name: Run Prisma migrations
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          MIGRATION_JOB="jammers-web-migrate-${DEPLOY_SHA::7}"
          kubectl -n "$K8S_NAMESPACE" get jobs -o name \
            | grep '^job.batch/jammers-web-migrate-' \
            | xargs -r kubectl -n "$K8S_NAMESPACE" delete --ignore-not-found
          sed \
            -e "s/name: jammers-web-migrate/name: ${MIGRATION_JOB}/" \
            -e "s|ghcr.io/kinteus/jammers-web:latest|${IMAGE_REF}|g" \
            infra/k8s/base/migration-job.example.yaml \
            | kubectl -n "$K8S_NAMESPACE" apply -f -
          if ! kubectl -n "$K8S_NAMESPACE" wait --for=condition=complete --timeout=10m "job/${MIGRATION_JOB}"; then
            kubectl -n "$K8S_NAMESPACE" get job "${MIGRATION_JOB}" -o wide || true
            kubectl -n "$K8S_NAMESPACE" describe job "${MIGRATION_JOB}" || true
            kubectl -n "$K8S_NAMESPACE" get pods -l "job-name=${MIGRATION_JOB}" -o wide || true
            kubectl -n "$K8S_NAMESPACE" describe pods -l "job-name=${MIGRATION_JOB}" || true
            kubectl -n "$K8S_NAMESPACE" logs "job/${MIGRATION_JOB}" --all-containers=true --prefix=true || true
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE" logs "job/${MIGRATION_JOB}" --all-containers=true --prefix=true

      - name: Restore production scale
        if: always() && steps.capacity.outcome == 'success'
        run: |
          kubectl -n "$K8S_NAMESPACE" patch hpa jammers-web --type=merge -p '{"spec":{"minReplicas":${{ steps.capacity.outputs.hpa_min }},"maxReplicas":${{ steps.capacity.outputs.hpa_max }}}}'
          kubectl -n "$K8S_NAMESPACE" scale deployment/jammers-web --replicas=${{ steps.capacity.outputs.replicas }}
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/jammers-web --timeout=10m

      - name: Roll out deployment
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/jammers-web app="${IMAGE_REF}"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/jammers-web --timeout=10m

      - name: Deployment summary
        run: |
          kubectl -n "$K8S_NAMESPACE" get deployment,pods,svc,ingress
